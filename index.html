<script>
  const USER_MAP_ID = "67b6ebd01839b658aefa32d3";
  const USER_SHEET_EXEC = "https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec";

  const params = new URLSearchParams(window.location.search);
  const signedInUserEmail = params.get("userEmail") || "";

  function initMap() {
    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.737, lng: -3.5 },
      zoom: 12,
      mapId: USER_MAP_ID
    });

    const markers = {};
    const infoWindow = new google.maps.InfoWindow();

    async function fetchUserJobs() {
      try {
        const res = await fetch(USER_SHEET_EXEC + "?_=" + Date.now());
        const geojson = await res.json();
        if (!geojson || !Array.isArray(geojson.features)) return;

        const seen = new Set();

        geojson.features.forEach(feature => {
          const props = feature.properties || {};
          if ((props.userEmail || "") !== signedInUserEmail) return;

          const id = props.address;
          seen.add(id);

          const icon = props.icon || "place";
          const color = props.companyColor || "#000000";
          const photo = props.photo || "";

          if (markers[id]) {
            // Update icon and photo if marker already exists
            const el = markers[id].content;
            if (el.textContent !== icon) {
              el.textContent = icon;
            }
            markers[id].photo = photo; // store photo for click popup
          } else {
            // Create new marker
            const el = document.createElement("div");
            el.className = "material-icon-marker";
            el.style.color = color;
            el.textContent = icon;

            const marker = new google.maps.marker.AdvancedMarkerElement({
              map,
              position: {
                lat: parseFloat(feature.geometry.coordinates[1]),
                lng: parseFloat(feature.geometry.coordinates[0])
              },
              content: el
            });

            marker.photo = photo; // store photo for click popup

            marker.addListener("click", () => {
              const photoHtml = marker.photo ? `<img src="${marker.photo}" class="popup-img" alt="photo">` : "";
              const html = `<div style="font-family: Arial, sans-serif; font-size:14px;"><strong>${id}</strong>${photoHtml}</div>`;
              infoWindow.setContent(html);
              infoWindow.open(map, marker);
            });

            markers[id] = marker;
          }
        });

        // Optional cleanup: remove markers no longer in the sheet
        for (const id in markers) {
          if (!seen.has(id)) {
            markers[id].setMap(null);
            delete markers[id];
          }
        }

      } catch (e) {
        console.error("Failed to fetch jobs:", e);
      }
    }

    fetchUserJobs();
    setInterval(fetchUserJobs, 3000);
  }
</script>

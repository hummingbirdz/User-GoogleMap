<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>User Google Map (diagnostic)</title>

  <!-- Material Symbols filled (opsz 24) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />

  <style>
    #map { height: 100vh; width: 100%; }
    .material-icon-marker {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .popup-img {
      max-width: 200px;
      max-height: 150px;
      display: block;
      margin-top: 5px;
      border-radius: 6px;
    }
  </style>

  <!-- Maps API (no async here so code below runs after the library is available) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&libraries=marker"></script>
</head>
<body>
  <div id="map"></div>

  <script>
    // read user email from query param
    const params = new URLSearchParams(window.location.search);
    const signedInUserEmail = params.get('userEmail');
    console.log('[Map] signedInUserEmail:', signedInUserEmail);

    const map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 50.737, lng: -3.5 },
      zoom: 12,
      mapId: '67b6ebd01839b65816f4222e'
    });

    const markers = {};         // address -> AdvancedMarkerElement
    const lastJobIds = new Set(); // addresses we've added
    const infoWindow = new google.maps.InfoWindow();

    // helper: normalize icon string and address id
    function normalizeIcon(iconRaw) {
      if (!iconRaw && iconRaw !== '') return '';
      try { return String(iconRaw).toLowerCase().trim().replace('_','-'); } catch(e) { return ''; }
    }
    function normalizeAddress(a) {
      if (!a && a !== '') return '';
      try { return String(a).trim(); } catch(e) { return ''; }
    }

    async function fetchUserJobs() {
      try {
        const res = await fetch('https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec?v=' + Date.now());
        const geojson = await res.json();

        if (!geojson || !Array.isArray(geojson.features)) {
          console.warn('[Map] Unexpected GeoJSON format:', geojson);
          return;
        }

        console.log('[Map] fetched features:', geojson.features.length);

        // loop through features
        geojson.features.forEach((feature, i) => {
          // defensive checks
          if (!feature || !feature.properties) {
            console.warn(`[Map] skip feature[${i}] missing properties`, feature);
            return;
          }

          const userEmail = feature.properties.userEmail || '';
          if (String(userEmail) !== String(signedInUserEmail)) {
            // not this user's feature
            return;
          }

          // address as canonical id
          const addressRaw = feature.properties.address;
          const id = normalizeAddress(addressRaw);
          if (!id) {
            console.warn(`[Map] feature[${i}] has no address -> skipping`, feature);
            return;
          }

          // coords validation
          if (!feature.geometry || !Array.isArray(feature.geometry.coordinates)) {
            console.warn(`[Map] feature[${i}] missing coordinates -> skipping`, feature.properties);
            return;
          }
          const rawLng = feature.geometry.coordinates[0];
          const rawLat = feature.geometry.coordinates[1];
          const lng = parseFloat(rawLng);
          const lat = parseFloat(rawLat);
          if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
            console.warn(`[Map] feature[${i}] invalid coords -> skipping`, { rawLng, rawLat, lat, lng, feature });
            return;
          }

          const iconRaw = feature.properties.icon;
          const icon = normalizeIcon(iconRaw);
          console.log(`[Map] feature[${i}] id="${id}" icon="${icon}" coords=(${lat},${lng})`);

          // -------------------------
          // 1) removal handling FIRST
          // -------------------------
          if (icon === 'remove-marker' || icon === 'remove-marker' /* normalized already */) {
            if (markers[id]) {
              console.log(`[Map] removing marker for "${id}"`);
              try {
                markers[id].setMap(null);
              } catch(e) {
                console.warn('[Map] error removing marker:', e);
              }
              delete markers[id];
              lastJobIds.delete(id);
            } else {
              console.log(`[Map] remove-marker requested but no marker found for "${id}"`);
            }
            // done with this feature
            return;
          }

          // -------------------------
          // 2) create marker if not exists (original working logic)
          // -------------------------
          if (lastJobIds.has(id)) {
            // marker already exists; do nothing
            // (we purposely do not update position/props to keep logic minimal)
            return;
          }

          // create marker
          const color = feature.properties.companyColor || '#000000';
          const iconName = feature.properties.icon || 'place';

          const el = document.createElement('div');
          el.className = 'material-icon-marker';
          el.style.color = color;
          el.textContent = iconName;

          const marker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: { lat, lng },
            content: el
          });

          // popup content (address + optional photo)
          marker.addListener('click', () => {
            let content = `<div style="font-family:Arial, sans-serif; font-size:14px;"><strong>${id}</strong>`;
            if (feature.properties.photo) {
              // small safety: encode URL
              const photoUrl = feature.properties.photo;
              content += `<br><img src="${photoUrl}" class="popup-img" alt="photo">`;
            }
            content += `</div>`;
            infoWindow.setContent(content);
            infoWindow.open(map, marker);
          });

          markers[id] = marker;
          lastJobIds.add(id);
          console.log(`[Map] added marker for "${id}"`);
        });

      } catch (err) {
        console.error('Failed to fetch jobs:', err);
      }
    }

    // initial load
    fetchUserJobs();
    // poll
    setInterval(fetchUserJobs, 3000);
  </script>
</body>
</html>

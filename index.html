<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Google Map</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
  <style>
    #map { height: 100vh; width: 100%; }
    .material-icon-marker {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&libraries=marker"></script>
</head>
<body>
  <div id="map"></div>

  <script>
    // Get user email from URL query parameter
    const params = new URLSearchParams(window.location.search);
    const signedInUserEmail = params.get("userEmail");

    // Utility to normalise address IDs
    const normalize = addr => (addr || "").trim().toLowerCase();

    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.737, lng: -3.5 }, // Exeter
      zoom: 12,
      mapId: "67b6ebd01839b65816f4222e"
    });

    const markers = {};

    async function fetchUserJobs() {
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec");
        const geojson = await response.json();

        geojson.features.forEach(feature => {
          const props = feature.properties;
          if (props.userEmail !== signedInUserEmail) return;

          const addressId = normalize(props.address);
          const iconName = props.icon || "place";
          const color = props.companyColor || "#000000";

          // 🧹 Handle REMOVE MARKER
          if (iconName === "remove_marker") {
            if (markers[addressId]) {
              markers[addressId].setMap(null);
              delete markers[addressId];
              console.log(`🗑️ Removed marker for: ${props.address}`);
            } else {
              console.log(`⚠️ Tried to remove, but no marker found for: ${props.address}`);
            }
            return; // Skip creating new marker
          }

          // 🆕 Create or update marker
          if (!markers[addressId]) {
            const el = document.createElement("div");
            el.className = "material-icon-marker";
            el.style.color = color;
            el.textContent = iconName;

            const marker = new google.maps.marker.AdvancedMarkerElement({
              map,
              position: {
                lat: parseFloat(feature.geometry.coordinates[1]),
                lng: parseFloat(feature.geometry.coordinates[0])
              },
              content: el
            });

            // Add info window
            const infoWindow = new google.maps.InfoWindow();
            marker.addListener("click", () => {
              const photoHtml = props.photo
                ? `<img src="${props.photo}" alt="Job photo" style="width:100%;max-width:200px;border-radius:6px;margin-top:6px;">`
                : "";
              const content = `
                <div style="font-family: Arial, sans-serif; font-size: 14px;">
                  <strong>${props.address}</strong><br>
                  ${photoHtml}
                </div>`;
              infoWindow.setContent(content);
              infoWindow.open(map, marker);
            });

            markers[addressId] = marker;
            console.log(`📍 Added marker for: ${props.address}`);
          }
        });
      } catch (e) {
        console.error("Failed to fetch jobs:", e);
      }
    }

    fetchUserJobs();
    setInterval(fetchUserJobs, 3000); // Refresh every 3 seconds
  </script>
</body>
</html>

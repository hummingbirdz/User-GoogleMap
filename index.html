<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Google Map</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
  <style>
    #map { height: 100vh; width: 100%; }
    .material-icon-marker {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .popup-img {
      max-width: 200px;
      max-height: 150px;
      display: block;
      margin-top: 5px;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&libraries=marker"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // Get user email from URL query parameter
    const params = new URLSearchParams(window.location.search);
    const signedInUserEmail = params.get("userEmail");

    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.737, lng: -3.5 }, // Exeter
      zoom: 12,
      mapId: "67b6ebd01839b65816f4222e"
    });

    const markers = {};
    let lastJobIds = new Set();
    const infoWindow = new google.maps.InfoWindow(); // single reusable info window

    async function fetchUserJobs() {
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec");
        const geojson = await response.json();

        geojson.features.forEach(feature => {
          if (feature.properties.userEmail !== signedInUserEmail) return;

          const id = feature.properties.address; // unique by address

          // Remove marker if icon is "remove-marker"
          if (feature.properties.icon === "remove-marker") {
            if (markers[id]) {
              markers[id].setMap(null);
              delete markers[id];
              lastJobIds.delete(id);
            }
            return; // skip adding a new marker
          }

          if (lastJobIds.has(id)) return; // skip if already added

          const iconName = feature.properties.icon || "place";
          const color = feature.properties.companyColor || "#000000";

          const el = document.createElement("div");
          el.className = "material-icon-marker";
          el.style.color = color;
          el.textContent = iconName;

          const marker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: {
              lat: parseFloat(feature.geometry.coordinates[1]),
              lng: parseFloat(feature.geometry.coordinates[0])
            },
            content: el
          });

          // Add popup
          marker.addListener("click", () => {
            let content = `<div style="font-family: Arial, sans-serif; font-size: 14px;">
                             <strong>${feature.properties.address}</strong>`;
            if (feature.properties.photo) {
              content += `<img src="${feature.properties.photo}" class="popup-img">`;
            }
            content += `</div>`;
            infoWindow.setContent(content);
            infoWindow.open(map, marker);
          });

          markers[id] = marker;
          lastJobIds.add(id);
        });
      } catch (e) {
        console.error("Failed to fetch jobs:", e);
      }
    }

    fetchUserJobs();
    setInterval(fetchUserJobs, 3000); // refresh every 3 seconds
  </script>
</body>
</html>

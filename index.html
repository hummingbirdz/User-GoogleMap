<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Job Map</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
  <style>
    #map { height: 100vh; width: 100%; }
    .material-icon-marker {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 1px rgba(0,0,0,0.5); /* optional thin outline for visibility */
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&map_ids=67b6ebd01839b65816f4222e&libraries=marker"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // Parse query parameter to get the signed-in user's email
    const urlParams = new URLSearchParams(window.location.search);
    const signedInUserEmail = urlParams.get('userEmail');

    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 50.737, lng: -3.505 }, // Exeter center
      zoom: 13
    });

    const markers = {};

    async function fetchUserJobs() {
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec");
        const geojson = await response.json();

        geojson.features.forEach(feature => {
          const userEmail = feature.properties.userEmail;
          if (userEmail !== signedInUserEmail) return; // only show current user's markers

          const id = feature.properties.address || feature.geometry.coordinates.join(',');

          if (markers[id]) return; // skip duplicate

          const iconName = feature.properties.icon || "place";
          const color = feature.properties.companyColor || "#000000";

          const el = document.createElement("div");
          el.className = "material-icon-marker";
          el.style.color = color;
          el.textContent = iconName;

          const marker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: {
              lat: parseFloat(feature.geometry.coordinates[1]),
              lng: parseFloat(feature.geometry.coordinates[0])
            },
            content: el
          });

          markers[id] = marker;
        });
      } catch (e) {
        console.error("Failed to fetch user jobs:", e);
      }
    }

    fetchUserJobs();
    // Optional: Poll every 3 seconds for new jobs
    setInterval(fetchUserJobs, 3000);
  </script>
</body>
</html>

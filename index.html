<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Google Map</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
  <style>
    #map { height: 100vh; width: 100%; }
    .material-icon-marker {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      display: flex; justify-content: center; align-items: center;
      color: inherit;
      -webkit-text-stroke: 0.50px #222;
    }
    .popup-img {
      max-width: 200px;
      max-height: 150px;
      display: block;
      margin-top: 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const USER_MAP_ID = "67b6ebd01839b658aefa32d3";
    const USER_SHEET_EXEC = "https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec";

    // Read signed-in user email from URL
    const params = new URLSearchParams(window.location.search);
    const signedInUserEmail = params.get("userEmail") || "";

    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 50.737, lng: -3.5 }, // Exeter
        zoom: 12,
        mapId: USER_MAP_ID
      });

      const markers = {};
      const infoWindow = new google.maps.InfoWindow();

      async function fetchUserJobs() {
        try {
          const res = await fetch(USER_SHEET_EXEC + "?_=" + Date.now());
          const geojson = await res.json();
          if (!geojson || !Array.isArray(geojson.features)) return;

          geojson.features.forEach(feature => {
            const props = feature.properties || {};
            if ((props.userEmail || "") !== signedInUserEmail) return;

            const id = props.address || `${feature.geometry.coordinates[1]},${feature.geometry.coordinates[0]}`;

            // Only replace marker if icon or photo has changed
            if (markers[id]) {
              const existingMarker = markers[id];
              if (existingMarker.photo === props.photo && existingMarker.content.textContent === (props.icon || "place")) {
                // No changes — keep marker as-is
                return;
              }
              // 🔧 Remove old marker before creating new one
              existingMarker.map = null;
              delete markers[id];
            }

            // Create new marker
            const el = document.createElement("span");
            el.className = "material-icon-marker";
            el.style.color = props.companyColor || "#000000";
            el.textContent = props.icon || "place";

            const marker = new google.maps.marker.AdvancedMarkerElement({
              map,
              position: {
                lat: parseFloat(feature.geometry.coordinates[1]),
                lng: parseFloat(feature.geometry.coordinates[0])
              },
              content: el
            });

            marker.photo = props.photo || "";

            marker.addListener("click", () => {
              const photoHtml = marker.photo
                ? `<div style="margin-bottom: 8px;">
                     <img src="${marker.photo}?v=${Date.now()}" class="popup-img" alt="photo" style="max-width: 100%; border: 1px solid #ccc; border-radius: 4px;">
                   </div>`
                : "";

              const html = `
                <div style="font-family: Arial, sans-serif; font-size: 14px; line-height: 1.5; padding: 6px;">
                  ${photoHtml}
                  <strong>${props.address}</strong><br>
                  <em>${props.jobType}</em><br>
                  ${props.notes ? `<strong>Notes:</strong> ${props.notes}<br>` : ""}
                  ${props.what3words ? `<strong>W3W:</strong> ${props.what3words}<br>` : ""}
                </div>
              `;

              infoWindow.setContent(html);
              infoWindow.open(map, marker);
            });

            markers[id] = marker;
          });
        } catch (e) {
          console.error("Failed to fetch jobs:", e);
        }
      }

      // Initial fetch only — no automatic 3-second refresh
      fetchUserJobs();
    }
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&callback=initMap&libraries=marker&v=weekly">
  </script>
</body>
</html>

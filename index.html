<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>User Map - Completed Jobs</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" />
  <style>
    #map { height: 100vh; width: 100%; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-family: 'Material Symbols Outlined';
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-RylSa34BE858N-s7VGpRSYW0gOj0at8&map_ids=67b6ebd01839b65816f4222e&libraries=marker"></script>
</head>
<body>
  <div id="map"></div>

  <script>
    const loggedInUserEmail = "greatestateagent@gmail.com"; // For testing

    const map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 51.5074, lng: -0.1278 },
      zoom: 10,
      mapId: "67b6ebd01839b65816f4222e"
    });

    const markers = {};
    let lastJobIds = new Set();

    async function fetchUserJobs() {
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyH7eeJTFdynMfEocpksqzcwgnPSaRchrMPezHBzkW0Hc9VOmHrhAzE1Wc-h8FJWSUC7w/exec");
        const geojson = await response.json();

        geojson.features.forEach(feature => {
          const id = feature.properties.address;

          if (lastJobIds.has(id)) return; // skip already-added marker

          // Only show markers for the logged-in user's email
          if (feature.properties.userEmail !== loggedInUserEmail) return;

          const iconName = feature.properties.icon || "place";
          const color = feature.properties.companyColor || "#000000";

          const el = document.createElement("div");
          el.className = "material-symbols-outlined";
          el.style.color = color;
          el.textContent = iconName;

          const marker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: {
              lat: parseFloat(feature.geometry.coordinates[1]),
              lng: parseFloat(feature.geometry.coordinates[0])
            },
            content: el
          });

          markers[id] = marker;
          lastJobIds.add(id);
        });
      } catch (e) {
        console.error("Failed to fetch jobs:", e);
      }
    }

    // Initial load
    fetchUserJobs();

    // Poll every 3 seconds for new jobs
    setInterval(fetchUserJobs, 3000);
  </script>
</body>
</html>
